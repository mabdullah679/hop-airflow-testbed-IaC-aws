name: ci-deploy
on:
  pull_request:
  push:
    branches: [prod-hardening]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.12.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install pytest ruff
      - run: ruff check app tests
      - name: Unit tests (pure logic)
        run: pytest -q tests/test_checks.py
      - name: Build app image (Airflow + Hop) and run DAG import test inside it
        run: |
          docker build -t pf-hop-airflow:ci app
          bash scripts/dag_import_test.sh pf-hop-airflow:ci
      - name: Hop pipeline output assertion (real hop-run on sample data)
        run: bash scripts/hop_local_test.sh pf-hop-airflow:ci
  terraform:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - run: terraform fmt -check -recursive
        working-directory: infra
      - name: validate (no backend)
        working-directory: infra
        run: terraform init -backend=false -input=false && terraform validate
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [terraform, secrets-scan]
    concurrency: pf-hop-airflow-deploy
    permissions:
      id-token: write # OIDC: no stored AWS keys
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::346208529954:role/pf-hop-airflow-gha-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Guard account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "346208529954"
      - name: Plan
        working-directory: infra
        env:
          ALLOWED_CIDR: ${{ vars.ALLOWED_CIDR }}
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan -var "allowed_cidr=${ALLOWED_CIDR}"
      - name: Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan
      - name: Wait for the instance to register with SSM
        working-directory: infra
        run: |
          IID=$(terraform output -raw instance_id)
          for i in $(seq 1 40); do
            aws ssm describe-instance-information --filters Key=InstanceIds,Values=$IID --query 'InstanceInformationList[0].PingStatus' --output text | grep -q Online && break; sleep 10
          done
          echo "instance=$IID registered with SSM"
      - name: Roll out app bundle on the instance (idempotent deploy.sh, waits for first-boot deploy)
        run: bash scripts/ssm_run.sh "$(terraform -chdir=infra output -raw instance_id)" 1500 "aws s3 cp --only-show-errors s3://$(terraform -chdir=infra output -raw data_bucket)/app/deploy.sh /opt/pf/deploy.sh && chmod +x /opt/pf/deploy.sh && /opt/pf/deploy.sh 2>&1 | tail -5"
      - name: Smoke test
        run: bash scripts/smoke.sh "$(terraform -chdir=infra output -raw instance_id)" "$(terraform -chdir=infra output -raw data_bucket)"
